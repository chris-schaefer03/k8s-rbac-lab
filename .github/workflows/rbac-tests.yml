name: RBAC tests

on:
  push:
  pull_request:

jobs:
  rbac-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Create cluster
        run: make up

      - name: Run RBAC tests
        run: make test

      - name: Run agent
        run: make agent
