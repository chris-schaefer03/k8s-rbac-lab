apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Log every request made by the agent's identity (who, what, result – no contents)
  - level: Metadata
    users: ["system:serviceaccount:team-a:pod-reader"]
  # Ignore everything else to keep the log small
  - level: None
